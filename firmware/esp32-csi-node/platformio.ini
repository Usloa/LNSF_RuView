; PlatformIO Project Configuration for RuView ESP32 CSI Node
; ============================================================
; This firmware is natively an ESP-IDF CMake project (v5.4+).
; PlatformIO uses the ESP-IDF framework backend (arduino is NOT used).
;
; Default environment: esp32s3 (production target per README/ADR-018).
; Additional environments: esp32c6, esp32c5 (research targets).
;
; Open in VSCode with the PlatformIO IDE extension installed.
; Build:   pio run -e esp32s3
; Upload:  pio run -e esp32s3 -t upload
; Monitor: pio device monitor -e esp32s3

[platformio]
default_envs = esp32s3
src_dir = main
include_dir = main
boards_dir =

; ── Shared settings across all ESP32 targets ──────────────────
[common]
framework = espidf
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_display.csv
board_build.filesystem = spiffs
build_flags =
  ; version.txt is read by CMakeLists.txt at build time
  ; keep Kconfig defaults in sdkconfig.defaults
check_tool = cppcheck

; ── ESP32-S3 (production target, 8 MB flash) ──────────────────
[env:esp32s3]
; espressif32 platform >= 6.10 ships ESP-IDF 5.x which satisfies the
; project's v5.4+ requirement. Let PlatformIO resolve the matching
; framework-espidf package automatically — do NOT hard-code a fake version.
platform = espressif32@>=6.10
board = esp32-s3-devkitc-1
framework = ${common.framework}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags =
  ${common.build_flags}
  ; Board-specific SDK config overlay
  -DCONFIG_IDF_TARGET=\"esp32s3\"
board_build.flash_size = 8MB
build_type = release

; ── ESP32-C6 (research target, 4 MB flash, ADR-110) ───────────
[env:esp32c6]
platform = espressif32@>=6.10
board = esp32-c6-devkitc-1
framework = ${common.framework}
board_build.partitions = partitions_4mb.csv
board_build.filesystem = ${common.board_build.filesystem}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags =
  ${common.build_flags}
  -DCONFIG_IDF_TARGET=\"esp32c6\"
board_build.flash_size = 4MB
build_type = release

; ── ESP32-C5 (experimental target, 4 MB flash) ────────────────
; Requires ESP-IDF >= 5.5.2 — see firmware/esp32-csi-node/README.md
[env:esp32c5]
platform = espressif32@>=6.10
board = esp32-c5-devkitc-1
framework = ${common.framework}
board_build.partitions = partitions_4mb.csv
board_build.filesystem = ${common.board_build.filesystem}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags =
  ${common.build_flags}
  -DCONFIG_IDF_TARGET=\"esp32c5\"
board_build.flash_size = 4MB
build_type = release
