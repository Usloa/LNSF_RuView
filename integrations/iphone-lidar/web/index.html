<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>RuView iPhone LiDAR</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">RUVIEW 传感器桥接</p>
        <h1>iPhone LiDAR</h1>
      </div>
      <span id="status">连接中</span>
    </header>

    <section class="metrics">
      <div><strong id="fps">0.0</strong><span>帧率</span></div>
      <div><strong id="points">0</strong><span>点数</span></div>
      <div><strong id="seq">0</strong><span>序号</span></div>
      <div><strong id="latency">0</strong><span>MS</span></div>
    </section>

    <canvas id="view"></canvas>

    <footer>
      <span>仅几何信息</span>
      <span>不上传 RGB 影像</span>
      <span id="sensor">等待传感器数据</span>
    </footer>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
